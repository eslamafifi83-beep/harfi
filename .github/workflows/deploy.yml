# Makes any missing voice clips (ElevenLabs free plan; key kept as a GitHub secret), saves them in the
# project so they are never paid for twice, and publishes the app on GitHub Pages.
# Runs on every push to main, on the 2nd of each month (to finish clips when free credits renew), or by hand.
name: Voices and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 2 * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make missing voice clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: node voices/generate.mjs
      - name: Make tryout clips for the sound check page (only if voices/tryout.json lists missing ones)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node voices/tryout.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - name: Trim clips where the voice kept talking (free, uses Whisper)
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 voices/fix-clips.py
      - name: Save new clips in the project
        run: |
          git config user.name "harfi-bot"
          git config user.email "harfi-bot@users.noreply.github.com"
          git add -A app/audio app/tryout voices/fix-report.txt voices/tryout-log.txt 2>/dev/null || git add -A app/audio app/tryout
          if ! git diff --cached --quiet; then git commit -m "Voice clips" && git push; fi
      - name: New version for tablets
        run: sed -i "s/var VERSION = 'harfi-v1';/var VERSION = 'harfi-${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}';/" app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
