# Makes the voice clips with Azure (key kept as a GitHub secret) and publishes the app on GitHub Pages.
# Runs on every push to main, or by hand from the Actions tab.
name: Voices and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse clips from earlier runs
        uses: actions/cache@v4
        with:
          path: app/audio
          key: voices-${{ hashFiles('voices/lines.json', 'voices/voices.json') }}
          restore-keys: voices-
      - name: Make voice clips
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: node voices/generate.mjs
      - name: New version for tablets
        run: sed -i "s/var VERSION = 'harfi-v1';/var VERSION = 'harfi-${GITHUB_SHA::8}';/" app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
