# Checks every voice clip with Whisper (free) and saves voices/audit.txt: clips that don't match their text well
# are listed first. Run it by hand from the Actions tab.
name: Check voice clips
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 voices/fix-clips.py --audit
          git config user.name "harfi-bot"
          git config user.email "harfi-bot@users.noreply.github.com"
          git add voices/audit.txt
          git commit -m "Voice clip check" && git push || true
