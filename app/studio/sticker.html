<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sticker reveal</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* preview page: the new "you won a sticker" moment, with the duck as the example */
  body{overflow:hidden}
  .demo{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .demo .top{position:absolute;top:12px;right:16px;display:flex;gap:8px}
  .demo .note{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-weight:700;color:#174D12;z-index:3}

  /* ---- the reveal ---- */
  .sr{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none}
  .sr.on{pointer-events:auto}
  .sr-dim{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.0),rgba(43,27,72,.45));opacity:0;transition:opacity .4s}
  .sr.on .sr-dim{opacity:1}
  .sr-rays{position:absolute;left:50%;top:44%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;border-radius:50%;
    background:repeating-conic-gradient(rgba(255,233,140,.75) 0 6deg,rgba(255,233,140,0) 6deg 18deg);
    -webkit-mask:radial-gradient(circle,#000 0 12%,transparent 45%);mask:radial-gradient(circle,#000 0 12%,transparent 45%);
    opacity:0;transform:scale(.3);transition:opacity .4s,transform .8s cubic-bezier(.2,1.4,.4,1)}
  .sr.burst .sr-rays{opacity:1;transform:scale(1);animation:burstSpin 22s linear infinite}

  /* the sticker pack: foil, a star seal, a sheen running over it */
  .pack{position:relative;width:clamp(170px,26vmin,240px);aspect-ratio:3/4;cursor:pointer;transform:translateY(-120vh) rotate(-20deg)}
  .sr.on .pack{animation:packDrop .8s cubic-bezier(.3,1.5,.5,1) forwards,packWiggle 1.6s ease-in-out .9s infinite}
  .pack .half{position:absolute;left:0;right:0;border:5px solid var(--sk-ink);background:linear-gradient(135deg,#FF8A3D,#FF5AA0 45%,#8A5CF6 80%);overflow:hidden}
  .pack .half.a{top:0;height:52%;border-radius:22px 22px 0 0;border-bottom:none;clip-path:polygon(0 0,100% 0,100% 82%,88% 100%,76% 82%,64% 100%,52% 82%,40% 100%,28% 82%,16% 100%,4% 82%,0 100%)}
  .pack .half.b{bottom:0;height:52%;border-radius:0 0 22px 22px;border-top:none;box-shadow:0 8px 0 var(--sk-ink);clip-path:polygon(0 18%,4% 0,16% 18%,28% 0,40% 18%,52% 0,64% 18%,76% 0,88% 18%,100% 0,100% 100%,0 100%)}
  .pack .half.b{background:linear-gradient(135deg,#FF5AA0,#8A5CF6 55%,#22B5A6)}
  .pack .half::after{content:'';position:absolute;inset:-20%;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.65) 50%,transparent 60%);animation:sheen 2.2s ease-in-out infinite}
  .pack .seal{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:2;filter:drop-shadow(0 4px 0 var(--sk-ink))}
  .pack .q{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:clamp(34px,5vmin,46px);font-weight:800;color:#fff;-webkit-text-stroke:4px var(--sk-ink);paint-order:stroke fill;z-index:2}
  @keyframes packDrop{to{transform:none}}
  @keyframes packWiggle{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(-6deg) scale(1.03)}76%{transform:rotate(6deg) scale(1.03)}84%{transform:rotate(-3deg)}}
  @keyframes sheen{0%{transform:translateX(-80%)}60%,100%{transform:translateX(80%)}}
  .sr.shake .pack{animation:packShake .45s linear forwards}
  @keyframes packShake{0%,100%{transform:none}20%{transform:translate(-8px,2px) rotate(-5deg)}40%{transform:translate(8px,-2px) rotate(5deg)}60%{transform:translate(-10px,0) rotate(-7deg) scale(1.06)}80%{transform:translate(10px,0) rotate(7deg) scale(1.1)}}
  .sr.burst .pack .half.a{animation:tearUp .7s cubic-bezier(.3,.7,.5,1) forwards}
  .sr.burst .pack .half.b{animation:tearDown .7s cubic-bezier(.3,.7,.5,1) forwards}
  .sr.burst .pack .seal,.sr.burst .pack .q{animation:fadeOut .2s forwards}
  @keyframes tearUp{to{transform:translate(-40vw,-60vh) rotate(-80deg);opacity:0}}
  @keyframes tearDown{to{transform:translate(40vw,60vh) rotate(70deg);opacity:0}}
  @keyframes fadeOut{to{opacity:0}}
  .tap{font-weight:800;text-align:center;line-height:1.15;opacity:0;transition:opacity .3s;z-index:2}
  .sr.on .tap{opacity:1;animation:nudge 1.2s ease-in-out infinite}
  .sr.burst .tap{opacity:0;animation:none}
  .tap .ar{display:block;font-size:clamp(26px,4vmin,34px);color:#fff;-webkit-text-stroke:5px var(--sk-ink);paint-order:stroke fill}
  .tap .en{display:block;font-size:18px;color:#fff;-webkit-text-stroke:4px var(--sk-ink);paint-order:stroke fill}

  /* the sticker itself: a die-cut sticker (thick white edge, ink outline), a shine, a peeled corner */
  .stk{position:absolute;left:50%;top:44%;width:clamp(200px,34vmin,300px);transform:translate(-50%,-50%) scale(0) rotate(-400deg);z-index:3}
  .stk .art{position:relative;filter:url(#diecut) drop-shadow(0 10px 0 rgba(43,27,72,.35))}
  .stk .art svg{width:100%;height:auto;display:block;overflow:visible}
  .stk .gloss{position:absolute;inset:6%;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);background-size:300% 100%;background-position:100% 0;pointer-events:none}
  .sr.out .stk{animation:stkOut .9s cubic-bezier(.2,1.3,.4,1) forwards}
  @keyframes stkOut{0%{transform:translate(-50%,-50%) scale(0) rotate(-400deg)}70%{transform:translate(-50%,-58%) scale(1.25) rotate(8deg)}100%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}}
  .sr.out .stk .gloss{animation:gloss 1.1s ease-in-out .9s}
  @keyframes gloss{to{background-position:-100% 0}}
  /* alive: the duck waddles, hops and quacks */
  .sr.alive .stk .art{animation:waddle .42s ease-in-out 6 alternate,hop .84s cubic-bezier(.3,1.6,.5,1) .1s 3}
  @keyframes waddle{from{rotate:-9deg}to{rotate:9deg}}
  @keyframes hop{0%,100%{translate:0 0;scale:1 1}30%{translate:0 0;scale:1.12 .86}55%{translate:0 -38px;scale:.94 1.08}80%{translate:0 0;scale:1.08 .92}}
  .quack{position:absolute;left:68%;top:-2%;padding:6px 14px 4px;background:#fff;border:4px solid var(--sk-ink);border-radius:20px 20px 20px 6px;box-shadow:0 4px 0 var(--sk-ink);font-weight:800;line-height:1.05;text-align:center;transform:scale(0) rotate(-10deg);transform-origin:0 100%;white-space:nowrap}
  .quack .ar{display:block;font-size:26px;color:var(--sk-ink)}.quack .en{display:block;font-size:15px;color:#4A3D6B}
  .quack.pop{animation:quackPop .5s cubic-bezier(.3,1.8,.5,1) forwards}
  @keyframes quackPop{to{transform:scale(1) rotate(-6deg)}}
  /* the name banner */
  .banner{position:absolute;left:50%;top:calc(44% + clamp(120px,19vmin,170px));transform:translateX(-50%) scale(0);z-index:3;display:flex;flex-direction:column;align-items:center;background:var(--sk-yellow);border:5px solid var(--sk-ink);box-shadow:0 6px 0 var(--sk-ink);border-radius:999px;padding:4px 30px 6px;line-height:1.1}
  .banner .ar{font-size:clamp(34px,5vmin,46px);font-weight:800;color:var(--sk-ink)}
  .banner .en{font-size:18px;font-weight:800;color:var(--sk-ink)}
  .sr.named .banner{animation:bannerIn .55s cubic-bezier(.3,1.7,.5,1) forwards}
  @keyframes bannerIn{to{transform:translateX(-50%) scale(1)}}
  /* off it flies into the sticker book */
  .sr.fly .stk{transition:transform .75s cubic-bezier(.6,-.3,.6,1),opacity .75s}
  .sr.fly .banner,.sr.fly .sr-rays{transition:opacity .3s;opacity:0}
  .sr.fly .sr-dim{opacity:0}
  #bookBtn.got{animation:bookGot .6s cubic-bezier(.3,1.8,.5,1)}
  @keyframes bookGot{30%{transform:scale(1.35) rotate(-10deg)}60%{transform:scale(.95) rotate(4deg)}}
  #bookBtn .plus{position:absolute;right:-6px;top:-10px;background:var(--sk-pink);color:#fff;border:3px solid var(--sk-ink);border-radius:999px;font-size:14px;font-weight:800;padding:0 7px;animation:plusUp 1.2s ease-out forwards}
  @keyframes plusUp{0%{transform:scale(0)}30%{transform:scale(1.2)}100%{transform:translateY(-26px);opacity:0}}
  #bookBtn{position:relative}
  .again{z-index:2;transition:opacity .3s}
  body.playing .again,body.playing .demo .note{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.sr *{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- die-cut sticker: a thick white edge following the drawing's own shape, with an ink outline around it -->
  <filter id="diecut" x="-15%" y="-15%" width="130%" height="130%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="white"/>
    <feMorphology in="SourceAlpha" operator="dilate" radius="13" result="ink"/>
    <feFlood flood-color="#2B1B48"/><feComposite in2="ink" operator="in" result="inkFill"/>
    <feFlood flood-color="#FFFFFF"/><feComposite in2="white" operator="in" result="whiteFill"/>
    <feMerge><feMergeNode in="inkFill"/><feMergeNode in="whiteFill"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</svg>
<div class="demo">
  <div class="top"><span class="pill" id="bookBtn" aria-label="Sticker book"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F7C78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12l4 4v12H4z"/><path d="M16 4v4h4"/><circle cx="11" cy="13" r="3"/></svg><span id="count">4</span></span></div>
  <button class="go huge again" id="again"><span class="ar">كسبتي ستيكر!</span><span class="en" style="font-size:18px">Play the sticker moment</span></button>
  <div class="note en">Preview of the new sticker moment (example: the duck). Tap the button, then tap the pack.</div>
</div>

<div class="sr" id="sr" aria-live="polite">
  <div class="sr-dim"></div><div class="sr-rays"></div>
  <div class="pack" id="pack" role="button" aria-label="Open your sticker pack">
    <div class="half a"></div><div class="half b"></div>
    <svg class="seal" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#FFC93C" stroke="#2B1B48" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <div class="q">؟</div>
  </div>
  <div class="tap"><span class="ar">دوسي عشان تفتحي!</span><span class="en">Tap to open!</span></div>
  <div class="stk" id="stk"><div class="art" id="art"></div><div class="gloss" id="gloss"></div>
    <div class="quack" id="quack"><span class="ar">كواك!</span><span class="en">Quack!</span></div></div>
  <div class="banner" id="banner"><span class="ar">بطّة</span><span class="en">Duck</span></div>
</div>

<script src="../content.js"></script>
<script>
(function(){
  var C = window.HARFI_CONTENT, $ = function(s){ return document.querySelector(s); };
  var ac = null;
  function audio(){ if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} if (ac && ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f, t0, d, type, g, f2){ var a = audio(); if (!a) return; var o = a.createOscillator(), v = a.createGain(), t = a.currentTime + t0;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g || .15, t + .01); v.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(v); v.connect(a.destination); o.start(t); o.stop(t + d + .05); }
  function noise(t0, d, g){ var a = audio(); if (!a) return; var n = Math.floor(a.sampleRate * d), b = a.createBuffer(1, n, a.sampleRate), ch = b.getChannelData(0);
    for (var i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n); var s = a.createBufferSource(), v = a.createGain(); s.buffer = b; v.gain.value = g || .2; s.connect(v); v.connect(a.destination); s.start(a.currentTime + t0); }
  var SFX = {
    drop: function(){ tone(500, 0, .35, 'sine', .14, 160); },
    rattle: function(){ for (var i = 0; i < 6; i++) { noise(i * .07, .05, .12); tone(300 + i * 40, i * .07, .05, 'square', .04); } },
    pop: function(){ noise(0, .25, .5); tone(180, 0, .3, 'sine', .35, 50); [880, 1109, 1319, 1760].forEach(function(f, i){ tone(f, .08 + i * .07, .3, 'triangle', .12); }); },
    sparkle: function(){ [2093, 2637, 3136, 2637, 3520].forEach(function(f, i){ tone(f, i * .06, .18, 'sine', .07); }); },
    quack: function(t){ [0, .22].forEach(function(d){ tone(620, (t || 0) + d, .16, 'sawtooth', .09, 420); tone(1240, (t || 0) + d, .12, 'square', .03, 840); }); },
    boing: function(){ tone(220, 0, .28, 'sine', .2, 560); },
    whoosh: function(){ tone(260, 0, .45, 'sine', .08, 1200); noise(0, .35, .08); }
  };
  function confetti(n){
    var cols = ['#FF8A3D','#FFC93C','#22B5A6','#FF5AA0','#8A5CF6','#4FB83A'];
    for (var i = 0; i < n; i++) { var c = document.createElement('i'); c.className = 'conf'; c.style.left = (35 + Math.random() * 30) + 'vw'; c.style.top = '40vh';
      c.style.background = cols[i % cols.length]; c.style.setProperty('--dx', (Math.random() * 500 - 250) + 'px'); c.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
      c.style.setProperty('--d', (1.3 + Math.random() * 1.2) + 's'); document.body.appendChild(c); setTimeout(function(el){ return function(){ el.remove(); }; }(c), 2800); }
  }
  /* the sticker's art: the drawing without its ground shadow, so the white edge hugs the duck itself */
  var svg = C.PIC.duck.replace(/<ellipse cx="130" cy="202"[^>]*\/>/, '');
  $('#art').innerHTML = svg;
  $('#gloss').style.setProperty('--m', 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')) + '")');

  var sr = $('#sr'), busy = false, timers = [];
  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function play(){
    if (busy) return; busy = true; timers.forEach(clearTimeout); timers = [];
    sr.className = 'sr'; void sr.offsetWidth; $('#stk').style.transform = ''; $('#stk').style.opacity = ''; $('#quack').classList.remove('pop');
    sr.classList.add('on'); document.body.classList.add('playing'); SFX.drop();
    var opened = false;
    function open(){
      if (opened) return; opened = true;
      sr.classList.add('shake'); SFX.rattle();
      at(450, function(){ sr.classList.remove('shake'); sr.classList.add('burst'); SFX.pop(); confetti(90); });
      at(650, function(){ sr.classList.add('out'); SFX.whoosh(); });
      at(1500, function(){ SFX.sparkle(); sr.classList.add('alive'); });
      at(1650, function(){ $('#quack').classList.add('pop'); SFX.quack(); });
      at(2600, function(){ SFX.quack(); });
      at(2300, function(){ sr.classList.add('named'); SFX.boing(); });
      at(5200, function(){   /* into the sticker book */
        var b = $('#bookBtn').getBoundingClientRect(), s = $('#stk').getBoundingClientRect();
        var dx = (b.left + b.width / 2) - (s.left + s.width / 2), dy = (b.top + b.height / 2) - (s.top + s.height / 2);
        var stk = $('#stk');
        /* hand over from the pop-out animation to a plain transition, starting where it ended */
        stk.style.animation = 'none'; stk.querySelector('.art').style.animation = 'none';
        stk.style.transform = 'translate(-50%,-50%) scale(1) rotate(-4deg)'; void stk.offsetWidth;
        sr.classList.add('fly'); $('#quack').classList.remove('pop');
        stk.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(.12) rotate(360deg)';
        SFX.whoosh();
      });
      at(5950, function(){
        $('#stk').style.opacity = '0';
        var bk = $('#bookBtn'); bk.classList.remove('got'); void bk.offsetWidth; bk.classList.add('got');
        $('#count').textContent = (+$('#count').textContent) + 1;
        var p = document.createElement('span'); p.className = 'plus'; p.textContent = '+1'; bk.appendChild(p); setTimeout(function(){ p.remove(); }, 1300);
        tone(1319, 0, .2, 'sine', .12); tone(1760, .08, .3, 'sine', .1);
      });
      at(6500, function(){ sr.className = 'sr'; busy = false; document.body.classList.remove('playing'); var k = $('#stk'); k.style.animation = ''; k.querySelector('.art').style.animation = ''; });
    }
    $('#pack').onclick = open;
    at(4500, open);   /* opens by itself if she doesn't tap */
  }
  $('#again').addEventListener('click', function(){ audio(); play(); });
})();
</script>
</body>
</html>
